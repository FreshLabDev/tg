# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so a new Bot API release is noticed by a job rather than by a
    # user whose message went unanswered.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: mod verify
        run: go mod verify
      - name: test
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  bot-api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compare the declared Bot API version with Telegram's
        run: |
          declared=$(grep -oE 'BotAPI = "[0-9]+\.[0-9]+"' tg.go | grep -oE '[0-9]+\.[0-9]+')
          latest=$(curl -fsSL https://core.telegram.org/bots/api \
            | grep -oE 'Bot API [0-9]+\.[0-9]+' | head -1 | awk '{print $3}')
          echo "declared=$declared latest=$latest"
          if [ -z "$latest" ]; then
            echo "could not read Telegram's published version; leaving this to the next run"
            exit 0
          fi
          if [ "$declared" != "$latest" ]; then
            echo "::warning::tg targets Bot API $declared, Telegram is on $latest"
            exit 1
          fi
